<div [ngClass]="['image-preview', 'image-preview--' + size, showTextFallback ? 'image-preview--with-text' : '']">
  <img
    *ngIf="showImage"
    [src]="src!"
    [alt]="alt"
    (error)="onImageError()"
    class="image-preview__img"
  />
  <span *ngIf="showTextFallback" class="image-preview__fallback-text">
    {{ fallbackText }}
  </span>
  <div *ngIf="!showImage && !showTextFallback" class="image-preview__fallback">
    <svg [cIcon]="fallbackIcon" class="image-preview__icon"></svg>
  </div>
  <span
    *ngIf="hasStatus"
    [ngClass]="['image-preview__status', 'image-preview__status--' + status]"
    aria-hidden="true"
  ></span>
</div>

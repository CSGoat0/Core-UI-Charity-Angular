<div class="fade-in">
  <c-container fluid>
    <c-row>
      <c-col lg="8" xl="6">
        <c-card>
          <c-card-header>
            <div class="d-flex justify-content-between align-items-center">
              <h5 class="mb-0">
                <svg cIcon name="cil-building" class="me-2"></svg>
                {{ pageTitle }}
              </h5>
              <button
                cButton
                color="secondary"
                routerLink="/organizations"
                size="sm"
              >
                <svg cIcon name="cil-arrow-left" class="me-1"></svg>
                Back to List
              </button>
            </div>
          </c-card-header>
          <c-card-body>

            <!-- Loading State -->
            <div *ngIf="isLoading" class="text-center py-4">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <p class="text-body-secondary mt-2">Loading organization...</p>
            </div>

            <!-- Error Message -->
            <c-alert *ngIf="errorMessage" color="danger" dismissible>
              {{ errorMessage }}
            </c-alert>

            <!-- Success Message -->
            <c-alert *ngIf="successMessage" color="success" dismissible>
              {{ successMessage }}
            </c-alert>

            <!-- Form -->
            <form [formGroup]="organizationForm" (ngSubmit)="onSubmit()" *ngIf="!isLoading || isEditMode">
              <div class="mb-3">
                <label cLabel for="name">Organization Name <span class="text-danger">*</span></label>
                <c-input-group>
                  <span cInputGroupText>
                    <svg cIcon name="cil-building"></svg>
                  </span>
                  <input
                    type="text"
                    cFormControl
                    id="name"
                    formControlName="name"
                    placeholder="Enter organization name"
                    [ngClass]="{
                      'is-invalid': name?.invalid && name?.touched
                    }"
                  />
                </c-input-group>
                <div *ngIf="name?.invalid && name?.touched" class="invalid-feedback d-block">
                  <span *ngIf="name?.errors?.['required']">Organization name is required</span>
                  <span *ngIf="name?.errors?.['maxlength']">Name cannot exceed 200 characters</span>
                </div>
              </div>

              <div class="mb-3">
                <label cLabel for="address">Address</label>
                <c-input-group>
                  <span cInputGroupText>
                    <svg cIcon name="cil-location-pin"></svg>
                  </span>
                  <input
                    type="text"
                    cFormControl
                    id="address"
                    formControlName="address"
                    placeholder="Enter organization address"
                    [ngClass]="{
                      'is-invalid': address?.invalid && address?.touched
                    }"
                  />
                </c-input-group>
                <div *ngIf="address?.invalid && address?.touched" class="invalid-feedback d-block">
                  <span *ngIf="address?.errors?.['maxlength']">Address cannot exceed 500 characters</span>
                </div>
              </div>

              <div class="d-flex gap-2 mt-3">
                <button
                  cButton
                  color="primary"
                  type="submit"
                  [disabled]="isLoading || organizationForm.invalid"
                >
                  <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                  {{ isLoading ? 'Saving...' : (isEditMode ? 'Update Organization' : 'Create Organization') }}
                </button>
                <button
                  cButton
                  color="secondary"
                  type="button"
                  routerLink="/organizations"
                >
                  Cancel
                </button>
              </div>
            </form>
          </c-card-body>
        </c-card>
      </c-col>
    </c-row>
  </c-container>
</div>

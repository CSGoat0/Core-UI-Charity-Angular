<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container>
    <c-row class="justify-content-center">
      <c-col lg="6" md="8" xl="5">
        <c-card class="mx-4">
          <c-card-body class="p-4 text-center">

            <!-- Loading State -->
            <div *ngIf="isLoading" class="py-5">
              <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading...</span>
              </div>
              <p class="text-body-secondary">Verifying your email...</p>
            </div>

            <!-- Success State -->
            <div *ngIf="!isLoading && isSuccess">
              <svg cIcon name="cilCheckCircle" size="4xl" class="text-success mb-3"></svg>
              <h2 class="mb-3">Email Confirmed!</h2>
              <c-alert color="success" dismissible>
                {{ successMessage }}
              </c-alert>
              <button
                cButton
                color="primary"
                class="mt-3"
                (click)="goToLogin()"
              >
                <svg cIcon name="cilArrowRight" class="me-2"></svg>
                Go to Login
              </button>
            </div>

            <!-- Error State -->
            <div *ngIf="!isLoading && !isSuccess && errorMessage">
              <svg cIcon name="cilWarning" size="4xl" class="text-warning mb-3"></svg>
              <h2 class="mb-3">Confirmation Failed</h2>
              <c-alert color="danger" dismissible>
                {{ errorMessage }}
              </c-alert>

              <!-- Resend Confirmation Section -->
              <div *ngIf="showResendButton" class="mt-3">
                <p class="text-body-secondary small mb-2">
                  Didn't receive the email? Request a new one below.
                </p>

                <!-- Success Alert for Resend -->
                <c-alert *ngIf="resendSuccess" color="success" dismissible>
                  {{ resendSuccess }}
                </c-alert>

                <!-- Error Alert for Resend -->
                <c-alert *ngIf="resendError" color="danger" dismissible>
                  {{ resendError }}
                </c-alert>

                <button
                  cButton
                  color="primary"
                  class="mt-2"
                  (click)="resendConfirmation()"
                  [disabled]="isResending"
                >
                  <span *ngIf="isResending" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                  {{ isResending ? 'Sending...' : 'Resend Confirmation Email' }}
                </button>
              </div>

              <!-- Go to Login Button -->
              <div class="mt-3">
                <button
                  cButton
                  color="secondary"
                  (click)="goToLogin()"
                >
                  Back to Login
                </button>
              </div>
            </div>

          </c-card-body>
        </c-card>
      </c-col>
    </c-row>
  </c-container>
</div>

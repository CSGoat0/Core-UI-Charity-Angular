<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container>
    <c-row class="justify-content-center">
      <c-col lg="6" md="8" xl="5">
        <c-card class="mx-4">
          <c-card-body class="p-4">
            <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" cForm>
              <h1 class="text-center">Forgot Password</h1>
              <p class="text-body-secondary text-center">
                Enter your email address and we'll send you a link to reset your password.
              </p>

              <!-- Success Alert -->
              <c-alert *ngIf="successMessage" color="success" dismissible (closed)="resetForm()">
                {{ successMessage }}
                <div class="mt-2">
                  <button cButton color="primary" size="sm" routerLink="/login">
                    Back to Login
                  </button>
                </div>
              </c-alert>

              <!-- Error Alert -->
              <c-alert *ngIf="errorMessage" color="danger" dismissible (closed)="resetForm()">
                {{ errorMessage }}
              </c-alert>

              <!-- Email Field (always show unless success) -->
              <ng-container *ngIf="!successMessage">
                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilEnvelopeClosed"></svg>
                  </span>
                  <input
                    type="email"
                    cFormControl
                    formControlName="email"
                    placeholder="Email Address"
                    autoComplete="email"
                    [ngClass]="{
                      'is-invalid': email?.invalid && email?.touched,
                      'is-valid': email?.valid && email?.touched
                    }"
                  />
                </c-input-group>
                <div *ngIf="email?.invalid && email?.touched" class="invalid-feedback d-block mb-3">
                  <span *ngIf="email?.errors?.['required']">Email is required</span>
                  <span *ngIf="email?.errors?.['email']">Please enter a valid email address</span>
                </div>

                <div class="d-grid gap-2">
                  <button
                    cButton
                    color="primary"
                    type="submit"
                    [disabled]="isLoading || forgotForm.invalid"
                  >
                    <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                    {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
                  </button>
                </div>
              </ng-container>

              <div class="text-center mt-3">
                <p class="text-body-secondary">
                  Remember your password?
                  <a routerLink="/login" class="text-primary">Back to Login</a>
                </p>
              </div>
            </form>
          </c-card-body>
        </c-card>
      </c-col>
    </c-row>
  </c-container>
</div>
